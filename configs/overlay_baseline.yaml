seed: 42

debug:
  enabled: true
  max_samples: 200

data:
  train_csv: data/raw/train_labels.csv
  train_img_dir: data/raw/train/train
  test_img_dir: data/raw/public_test/public_test
  val_doc_type: MAURITIUS/ID
  img_size: 224
  num_workers: 0
  crop_margin: 0.75
  crop_cache_dir: data/processed/overlay_crops

model:
  type: overlay
  noise_frontend: bayar
  noise_feat_dim: 128
  use_rgb_stream: true
  rgb_backbone: resnet34
  rgb_pretrained: true
  fusion_dim: 128

train:
  epochs: 3
  batch_size: 16
  lr: 1.0e-4
  weight_decay: 1.0e-4
  scheduler: cosine

output:
  model_dir: outputs/models
  pred_dir: outputs/predictions
  sub_dir: outputs/submissions
  experiment_name: overlay_baseline
